apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: app
        image: sua-imagem-spring-boot:latest
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"